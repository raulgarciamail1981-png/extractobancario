{% extends 'base.html' %}
{% block title %}Conciliador Neostar · Resultado{% endblock %}

{% block content %}
  <div class="card card--centered">
    <h1 class="card__title">Resultado</h1>
    <p class="card__hint">Detalle de la última unificación.</p>

    {% if message %}
      <div class="alert alert--ok alert--block">{{ message }}</div>
    {% endif %}
    {% if error %}
      <div class="alert alert--error alert--block">{{ error }}</div>
    {% endif %}

    <div class="toolbar__actions">
      <a class="btn btn--primary" href="/upload">Volver a la carga</a>
      <a class="btn btn--ghost" href="/records">Ver el resumen</a>
    </div>
  </div>
{% endblock %}
