<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conciliador Neostar - Login</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%); font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #0f172a; }
      .card { width: min(520px, calc(100vw - 32px)); background: #ffffff; border-radius: 24px; box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12); padding: 36px; }
      .logo { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
      .logo-img { height: 40px; width: auto; }
      .logo-title { font-size: 1.5rem; font-weight: 700; margin: 0; }
      .logo-subtitle { margin: 4px 0 0; color: #54748a; font-size: 0.95rem; }
      h1 { margin: 0 0 18px; font-size: 1.9rem; }
      label { display: grid; gap: 8px; margin-bottom: 16px; font-weight: 600; }
      input { width: 100%; border: 1px solid #cbd5e1; border-radius: 14px; padding: 14px 16px; font-size: 1rem; }
      button { width: 100%; border: none; border-radius: 14px; background: #4338ca; color: #fff; padding: 14px 16px; font-size: 1rem; font-weight: 700; cursor: pointer; }
      .message { border-radius: 16px; padding: 16px; margin-bottom: 20px; color: #b91c1c; background: #fee2e2; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <img class="logo-img" src="{{ url_for('static', filename='neostar-logo.jpg') }}" alt="Neostar">
        <div>
          <p class="logo-subtitle">Ingresá con tu perfil para subir extractos</p>
        </div>
      </div>
      {% if error %}
        <div class="message">{{ error }}</div>
      {% endif %}
      <h1>Iniciar sesión</h1>
      <form method="post" action="/login">
        <label>Usuario
          <input name="username" required>
        </label>
        <label>Contraseña
          <input type="password" name="password" required>
        </label>
        <button type="submit">Ingresar</button>
      </form>
    </div>
  </body>
</html>
