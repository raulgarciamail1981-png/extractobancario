{% extends 'base.html' %}
{% block title %}Conciliador Neostar · Ingresar{% endblock %}

{% block content %}
  <div class="card card--centered">
    <img class="header__logo" style="height: 30px; margin-bottom: 1.4rem;"
         src="{{ url_for('static', filename='neostar-wordmark.png') }}" alt="Neostar">
    <h1 class="hero__title" style="font-size: 1.8rem;">Conciliador</h1>
    <p class="card__hint">Ingresá con tu usuario para subir y revisar extractos.</p>

    {% if error %}
      <div class="alert alert--error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn--primary btn--block">Ingresar</button>
    </form>
  </div>
{% endblock %}
