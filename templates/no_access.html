<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conciliador Neostar - Sin acceso</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef2ff; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #0f172a; }
      .card { width: min(560px, calc(100vw - 32px)); background: #ffffff; border-radius: 24px; box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12); padding: 32px; }
      .logo { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
      .logo-img { height: 36px; width: auto; }
      .logo-title { margin: 0; font-size: 1.35rem; font-weight: 700; }
      .message { border-radius: 18px; padding: 18px; margin-bottom: 24px; font-size: 1rem; background: #fee2e2; color: #991b1b; }
      .menu-row { display: flex; flex-wrap: wrap; gap: 12px; }
      .menu-link { display: inline-flex; align-items: center; justify-content: center; padding: 12px 18px; border-radius: 14px; text-decoration: none; background: #4338ca; color: #fff; font-weight: 700; }
      .menu-link:hover { background: #3730a3; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <img class="logo-img" src="{{ url_for('static', filename='neostar-logo.jpg') }}" alt="Neostar">
        <h1 class="logo-title">Sin acceso</h1>
      </div>
      <div class="message">No tenés permiso para acceder a esta sección con tu perfil actual ({{ role }}). Seguís logueado con normalidad.</div>
      <div class="menu-row">
        <a class="menu-link" href="/records">Ir a Registros</a>
        <a class="menu-link" href="/logout">Salir</a>
      </div>
    </div>
  </body>
</html>
