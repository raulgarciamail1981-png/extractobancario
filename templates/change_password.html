<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conciliador Neostar - Cambiar contraseña</title>
    <style>
      body { margin: 0; min-height: 100vh; background: #eff2ff; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #0f172a; }
      .page { max-width: 560px; margin: 28px auto; padding: 0 16px; }
      .card { background: #ffffff; border-radius: 24px; box-shadow: 0 24px 60px rgba(15, 23, 42, 0.08); padding: 32px; }
      .logo { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
      .logo-img { height: 36px; width: auto; }
      .logo-title { margin: 0; font-size: 1.35rem; font-weight: 700; }
      .subtitle { color: #64748b; margin: 4px 0 0; }
      .menu-row { display: flex; flex-wrap: wrap; gap: 12px; margin: 20px 0; }
      .menu-link { display: inline-flex; align-items: center; justify-content: center; padding: 12px 18px; border-radius: 14px; text-decoration: none; background: #4338ca; color: #fff; font-weight: 700; }
      .menu-link:hover { background: #3730a3; }
      .alert { border-radius: 16px; padding: 16px; margin-bottom: 20px; }
      .alert.success { background: #ecfdf5; color: #166534; }
      .alert.error { background: #fee2e2; color: #991b1b; }
      form { display: flex; flex-direction: column; gap: 14px; }
      label { display: flex; flex-direction: column; gap: 8px; font-weight: 600; color: #334155; }
      input { border: 1px solid #cbd5e1; border-radius: 12px; padding: 10px 12px; font-size: 1rem; }
      .hint { font-size: 0.85rem; color: #64748b; margin: -6px 0 0; }
      .button { border: none; border-radius: 14px; padding: 12px 18px; background: #4338ca; color: #fff; font-weight: 700; cursor: pointer; align-self: flex-start; }
      .button:hover { background: #3730a3; }

      @media (max-width: 480px) {
        .page { padding: 0 10px; margin: 14px auto; }
        .card { padding: 18px; border-radius: 18px; }
        .button { align-self: stretch; text-align: center; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="card">
        <div class="logo">
          <img class="logo-img" src="{{ url_for('static', filename='neostar-logo.jpg') }}" alt="Neostar">
          <div>
            <h1 class="logo-title">Cambiar contraseña</h1>
            <p class="subtitle">{{ display_name }} · {{ role }}</p>
          </div>
        </div>

        {% if message %}
          <div class="alert success">{{ message }}</div>
        {% endif %}
        {% if error %}
          <div class="alert error">{{ error }}</div>
        {% endif %}

        <form method="post">
          <label>
            Contraseña actual
            <input type="password" name="current_password" required>
          </label>
          <label>
            Contraseña nueva
            <input type="password" name="new_password" minlength="8" pattern="[A-Za-z0-9]+" required>
          </label>
          <p class="hint">Debe ser alfanumérica (solo letras y números) y tener al menos 8 caracteres. No hace falta cambiarla periódicamente.</p>
          <label>
            Confirmar contraseña nueva
            <input type="password" name="confirm_password" minlength="8" pattern="[A-Za-z0-9]+" required>
          </label>
          <button type="submit" class="button">Guardar contraseña</button>
        </form>

        <div class="menu-row">
          <a class="menu-link" href="/records">Volver</a>
        </div>
      </div>
    </div>
  </body>
</html>
